<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Winter Watch</title>
<style>
  /* ---------- Colour tokens (light + dark) ---------- */
  :root {
    --bg: #eef3f8;
    --card: #ffffff;
    --text: #13202e;
    --muted: #5b6b7c;
    --border: #d5dfe9;
    --accent: #1f6fb2;
    --accent-text: #ffffff;
    --accent-soft: #e2eef9;
    --ok: #1d7a46;
    --warn: #a35a00;
    --err: #b3261e;
    --header-a: #0f2a44;
    --header-b: #1f6fb2;
    --shadow: 0 1px 2px rgba(15, 42, 68, .06), 0 4px 16px rgba(15, 42, 68, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b131c;
      --card: #121d29;
      --text: #e4ecf4;
      --muted: #8fa1b3;
      --border: #22324a;
      --accent: #5aa9ec;
      --accent-text: #06121e;
      --accent-soft: #15283c;
      --ok: #5fcf8f;
      --warn: #f0b35a;
      --err: #ff8a80;
      --header-a: #0a1c2e;
      --header-b: #164a78;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  /* ---------- Header ---------- */
  header {
    background: linear-gradient(120deg, var(--header-a), var(--header-b));
    color: #fff;
    padding: 20px 16px;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .3px; }
  header p { margin: 2px 0 0; opacity: .85; font-size: 13px; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255, 255, 255, .14);
    border: 1px solid rgba(255, 255, 255, .25);
    border-radius: 999px; padding: 4px 12px; font-size: 13px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #f0b35a; }
  .dot.on { background: #5fcf8f; }

  /* ---------- Layout ---------- */
  main { padding: 20px 16px 40px; }
  .grid { display: grid; gap: 16px; grid-template-columns: 300px 1fr; align-items: start; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 16px;
  }
  .card h2 { margin: 0 0 12px; font-size: 16px; }

  label { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea {
    width: 100%;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  textarea { min-height: 96px; resize: vertical; }

  .row { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600;
    border-radius: 8px; padding: 8px 14px; cursor: pointer;
    border: 1px solid var(--accent);
    background: var(--accent); color: var(--accent-text);
  }
  button.ghost { background: transparent; color: var(--accent); }
  button:disabled { opacity: .55; cursor: wait; }

  .note { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .status { font-size: 13px; margin-top: 10px; min-height: 20px; }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }

  /* ---------- Answer ---------- */
  .answer {
    margin-top: 16px;
    border-top: 1px solid var(--border);
    padding-top: 14px;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .answer:empty { display: none; }
  .answer.err { color: var(--err); }
  .meta { font-size: 12px; color: var(--muted); margin-top: 8px; }

  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 0 16px 24px; }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div>
      <h1>❄ Winter Watch</h1>
      <p>Gritting decision support · County Cavan roads team</p>
    </div>
    <span class="pill"><span class="dot" id="keyDot"></span><span id="keyPill">No key saved</span></span>
  </div>
</header>

<main>
  <div class="wrap grid">

    <!-- ===== Settings panel ===== -->
    <section class="card" aria-labelledby="settingsTitle">
      <h2 id="settingsTitle">Settings</h2>

      <label for="provider">Provider</label>
      <select id="provider" disabled>
        <option value="anthropic">Anthropic (Claude)</option>
      </select>

      <label for="model">Model</label>
      <input id="model" type="text" spellcheck="false">

      <label for="apiKey">API key</label>
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="Paste your Anthropic API key">

      <div class="row">
        <button id="saveBtn">Save</button>
        <button id="forgetBtn" class="ghost">Forget key</button>
      </div>
      <div id="settingsStatus" class="status" role="status"></div>
      <p class="note">Your key is stored only in this browser (localStorage). It is never written into the code or uploaded to GitHub.</p>
    </section>

    <!-- ===== Question box ===== -->
    <section class="card" aria-labelledby="askTitle">
      <h2 id="askTitle">Ask Winter Watch</h2>
      <label for="question">Your question</label>
      <textarea id="question" placeholder="e.g. Say hello and tell me which model you are."></textarea>
      <div class="row">
        <button id="askBtn">Ask</button>
      </div>
      <div id="answer" class="answer" aria-live="polite"></div>
      <div id="meta" class="meta"></div>
    </section>

  </div>
</main>

<footer>Practice build · Mock CA2 · A person makes the final gritting decision.</footer>

<script>
/* =========================================================
   Phase 1 - "Your own brain"
   Settings (model + key in localStorage) and one AI call.
   ========================================================= */

const DEFAULT_MODEL = "claude-haiku-5-5";
const STORE_KEY   = "winterwatch.apiKey";
const STORE_MODEL = "winterwatch.model";

const $ = id => document.getElementById(id);

// --- localStorage helpers (wrapped: storage can be blocked in private mode) ---
function load(name) {
  try { return localStorage.getItem(name); } catch (e) { return null; }
}
function store(name, value) {
  try { localStorage.setItem(name, value); return true; } catch (e) { return false; }
}
function remove(name) {
  try { localStorage.removeItem(name); } catch (e) {}
}

// --- Show whether a key is saved (never shows the key itself) ---
function refreshKeyStatus() {
  const hasKey = !!load(STORE_KEY);
  $("keyDot").classList.toggle("on", hasKey);
  $("keyPill").textContent = hasKey ? "Key saved · " + ($("model").value || DEFAULT_MODEL) : "No key saved";
}

function setStatus(el, text, kind) {
  el.textContent = text;
  el.className = "status" + (kind ? " " + kind : "");
}

// --- Initial load ---
$("model").value = load(STORE_MODEL) || DEFAULT_MODEL;
if (load(STORE_KEY)) $("apiKey").placeholder = "Key saved (hidden)";
refreshKeyStatus();

// --- Save ---
$("saveBtn").addEventListener("click", () => {
  const key = $("apiKey").value.trim();
  const model = $("model").value.trim() || DEFAULT_MODEL;
  store(STORE_MODEL, model);
  if (key) {
    if (!store(STORE_KEY, key)) {
      setStatus($("settingsStatus"), "Could not save: browser storage is blocked.", "err");
      return;
    }
    $("apiKey").value = "";
    $("apiKey").placeholder = "Key saved (hidden)";
  }
  if (!load(STORE_KEY)) {
    setStatus($("settingsStatus"), "Model saved, but no API key yet.", "err");
  } else {
    setStatus($("settingsStatus"), "Saved.", "ok");
  }
  refreshKeyStatus();
});

// --- Forget key ---
$("forgetBtn").addEventListener("click", () => {
  remove(STORE_KEY);
  $("apiKey").value = "";
  $("apiKey").placeholder = "Paste your Anthropic API key";
  setStatus($("settingsStatus"), "Key removed from this browser.", "ok");
  refreshKeyStatus();
});

// --- Call Anthropic directly from the browser ---
async function askClaude(question) {
  const key = load(STORE_KEY);
  if (!key) throw new Error("No API key saved. Add it in Settings first.");
  const model = load(STORE_MODEL) || DEFAULT_MODEL;

  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true"
    },
    body: JSON.stringify({
      model: model,
      max_tokens: 1024,
      system: "You are Winter Watch, a decision-support assistant for a county council roads team. Be clear and concise. A person always makes the final decision.",
      messages: [{ role: "user", content: question }]
    })
  });

  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const msg = (data.error && data.error.message) || ("HTTP " + res.status);
    throw new Error(msg);
  }
  const text = (data.content || []).filter(b => b.type === "text").map(b => b.text).join("\n");
  return { text, model: data.model || model, usage: data.usage || {} };
}

// --- Ask button ---
async function onAsk() {
  const q = $("question").value.trim();
  if (!q) { $("question").focus(); return; }

  const btn = $("askBtn");
  btn.disabled = true;
  btn.textContent = "Thinking…";
  $("answer").className = "answer";
  $("answer").textContent = "";
  $("meta").textContent = "";

  try {
    const r = await askClaude(q);
    $("answer").textContent = r.text || "(empty answer)";
    $("meta").textContent = "Model: " + r.model;
  } catch (e) {
    $("answer").className = "answer err";
    $("answer").textContent = "Error: " + e.message;
  } finally {
    btn.disabled = false;
    btn.textContent = "Ask";
  }
}

$("askBtn").addEventListener("click", onAsk);
$("question").addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) onAsk();
});
</script>
</body>
</html>
